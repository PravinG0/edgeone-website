kind = "web"
previewPath = "/"
title = "EdgeOne – IoT Infrastructure & Edge Intelligence Platform"
version = "1.0.0"
id = "artifacts/edgeone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21540

[services.development]
run = "pnpm --filter @workspace/edgeone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edgeone", "run", "build" ]
publicDir = "artifacts/edgeone/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21540"
BASE_PATH = "/"
